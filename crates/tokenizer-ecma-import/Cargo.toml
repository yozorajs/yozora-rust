[package]
name = "yozora-tokenizer-ecma-import"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
readme.workspace = true
description = "Yozora tokenizer for ECMAScript import declarations."
include = ["src/**"]
repository.workspace = true

[dependencies]
regex = "1.12.3"
yozora-core-tokenizer = { version = "0.1.0", path = "../core-tokenizer" }
yozora-ast = { version = "0.1.0", path = "../ast" }
yozora-character = { version = "0.1.0", path = "../character" }

[lib]
path = "src/lib.rs"
